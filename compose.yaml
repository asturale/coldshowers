services:
  app:
    security_opt:
      - no-new-privileges:true
    build: .
    container_name: coldshowers
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_PATH=/data/coldshowers.db
      - NODE_ENV=production
      - TZ=Europe/Amsterdam
    volumes:
      - ./data:/data
    networks:
      - coldshowers-proxy
networks:
  # Dedicated network shared only with the reverse proxy, so services don't
  # see each other on a shared network; the proxy joins it as an external member.
  coldshowers-proxy:
    name: coldshowers-proxy
