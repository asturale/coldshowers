services:
  app:
    security_opt:
      - no-new-privileges:true
    build: .
    container_name: coldshowers
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_PATH=/data/coldshowers.db
      - NODE_ENV=production
      - TZ=Europe/Amsterdam
    volumes:
      - ./data:/data
    networks:
      - coldshowers-proxy
networks:
  # Eigen netwerk met alleen Caddy (30-10-2026): diensten zien elkaar niet meer
  # via het gedeelde caddy-netwerk. Caddy zit er als external lid op.
  coldshowers-proxy:
    name: coldshowers-proxy
